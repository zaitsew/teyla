# A fragment, not a stack. templates/platform/add-product.sh renders it to /srv/{{name}}/docker-compose.yml
# and adds that path to the root compose file's `include:` list. The code goes in /srv/{{name}}/app and the
# captures and keys in /srv/{{name}}/data, which README.md step 1 creates.
services:
  review-channel:
    build: ./app
    image: review-channel:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 64m
    read_only: true
    # No published port: the reverse proxy reaches it by service name on the apps network.
    networks: [apps]
    volumes:
      - /srv/{{name}}/data:/data
      - /srv/{{name}}/data/keys:/keys:ro   # a directory, not a file: a rename of keys.txt must stay visible

networks:
  apps:
    external: true
