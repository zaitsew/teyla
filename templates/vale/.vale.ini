# Vale config for register (a) of the writing policy: replies, status and internal docs.
# Copy this file and the `styles/` folder into a repo, then run `vale docs README.md`.
# Install Vale first (https://vale.sh). `Sentences.yml` needs Vale 3.21 or later.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Teyla
