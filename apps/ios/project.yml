name: Teyla
options:
  bundleIdPrefix: com.zaitsew
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # The archive takes the team from the project (~/ops/bin/testflight release does not pass it).
    # The publisher's team; a team id is not a secret. Building with another team: override it.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VWH2FKV78Q
targets:
  Teyla:
    type: application
    platform: iOS
    sources:
      - Teyla
      # The snapshot models and text helpers are shared with the Mac app, not copied.
      - path: ../mac/Teyla/Core/Models.swift
        group: Shared
      - path: ../mac/Teyla/Core/Format.swift
        group: Shared
      # What Home and Decisions decide (who a question belongs to, what a core card says) is the Mac's code too.
      - path: ../mac/Teyla/Core/HomeLogic.swift
        group: Shared
      # The visual grammar: both apps build their pages from the same components.
      - path: ../mac/Teyla/UI/Grammar.swift
        group: Shared
      # A goal's row of circles and its pace chip: the Today card draws what the Mac's Today page draws.
      - path: ../mac/Teyla/UI/GoalBeads.swift
        group: Shared
      # The admin sections' parsers and words (docs/CONSOLE.md): Growth, Money, Operations and Playbook read the snapshot's
      # compact console with the code the Mac's pages use. None of these files has a view in it.
      - path: ../mac/Teyla/Core/ConsoleReport.swift
        group: Shared
      - path: ../mac/Teyla/Core/TeylaError.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleCompact.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleGrowth.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleOperations.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleMoney.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsolePlaybook.swift
        group: Shared
      - path: ../mac/Teyla/Core/GrowthLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleLogic.swift
        group: Shared
      # The activity graph's grid, words and kinds (docs/APP.md): the Growth tab draws the 17 weeks the Mac sends.
      - path: ../mac/Teyla/Core/Activity.swift
        group: Shared
      # The Today card's counts and words (docs/GTM.md): the Growth tab shows what the Mac sends in `gtm`, read-only.
      - path: ../mac/Teyla/Core/Gtm.swift
        group: Shared
      - path: ../mac/Teyla/Core/TodayLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGlimpse.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGoalCommands.swift
        group: Shared
    info:
      path: Teyla/Info.plist
      properties:
        CFBundleName: Teyla
        CFBundleDisplayName: Teyla
        CFBundleShortVersionString: "0.48.0"
        # Raise CURRENT_PROJECT_VERSION below by hand for each upload: the release tool does not.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The Mac's pairing code is a QR code holding `teyla-pair:v1:<key>`; the system Camera opens it here.
        CFBundleURLTypes:
          - CFBundleURLName: com.zaitsew.teyla.pair
            CFBundleURLSchemes:
              - teyla-pair
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Store readiness (POLICY 15): the app only uses encryption the system provides.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Teyla uses the camera to scan the pairing code shown on your Mac. Nothing is recorded.
        NSMicrophoneUsageDescription: Teyla listens while you dictate, to turn your voice into text on this iPhone. Audio never leaves it.
        NSSpeechRecognitionUsageDescription: Teyla turns your speech into text on this iPhone only. Nothing is sent to a server.
    settings:
      base:
        PRODUCT_NAME: Teyla
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla
        # iPhone only. XcodeGen's iOS default is "1,2", so it is set here, on the target (POLICY 15).
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Teyla/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TeylaTests:
    type: bundle.unit-test
    platform: iOS
    # Logic-only tests: the Core sources and AppModel are compiled into the bundle, so no app is launched.
    sources:
      - TeylaTests
      - Teyla/Core
      - Teyla/App/AppModel.swift
      - path: ../mac/Teyla/Core/Models.swift
        group: Shared
      - path: ../mac/Teyla/Core/Format.swift
        group: Shared
      # What Home and Decisions decide (who a question belongs to, what a core card says) is the Mac's code too.
      - path: ../mac/Teyla/Core/HomeLogic.swift
        group: Shared
      # The admin sections' parsers and words.
      - path: ../mac/Teyla/Core/ConsoleReport.swift
        group: Shared
      - path: ../mac/Teyla/Core/TeylaError.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleCompact.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleGrowth.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleOperations.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleMoney.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsolePlaybook.swift
        group: Shared
      - path: ../mac/Teyla/Core/GrowthLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/Activity.swift
        group: Shared
      - path: ../mac/Teyla/Core/Gtm.swift
        group: Shared
      - path: ../mac/Teyla/Core/TodayLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGlimpse.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGoalCommands.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Teyla:
    build:
      targets:
        Teyla: all
    test:
      targets:
        - TeylaTests
