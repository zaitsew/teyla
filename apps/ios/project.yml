name: Teyla
options:
  bundleIdPrefix: com.zaitsew
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # The archive takes the team from the project (~/ops/bin/testflight release does not pass it).
    # The publisher's team; a team id is not a secret. Building with another team: override it.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VWH2FKV78Q
targets:
  Teyla:
    type: application
    platform: iOS
    sources:
      - Teyla
      # The Share extension's queue: compiled into the extension too, and depends on nothing else.
      - path: Shared/TasteQueue.swift
        group: Shared
      # What the activity widget draws: the app writes it into the App Group, the widget reads it.
      - path: Shared/ActivityWidgetData.swift
        group: Shared
      # The snapshot models and text helpers are shared with the Mac app, not copied.
      - path: ../mac/Teyla/Core/Models.swift
        group: Shared
      - path: ../mac/Teyla/Core/Format.swift
        group: Shared
      # What Home and Decisions decide (who a question belongs to, what a core card says) is the Mac's code too.
      - path: ../mac/Teyla/Core/HomeLogic.swift
        group: Shared
      # The visual grammar: both apps build their pages from the same components.
      - path: ../mac/Teyla/UI/Grammar.swift
        group: Shared
      # A goal's row of circles and its pace chip: the Today card draws what the Mac's Today page draws.
      - path: ../mac/Teyla/UI/GoalBeads.swift
        group: Shared
      # The admin sections' parsers and words (docs/CONSOLE.md): Growth, Money, Operations and Playbook read the snapshot's
      # compact console with the code the Mac's pages use. None of these files has a view in it.
      - path: ../mac/Teyla/Core/ConsoleReport.swift
        group: Shared
      - path: ../mac/Teyla/Core/TeylaError.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleCompact.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleGrowth.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleOperations.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleMoney.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsolePlaybook.swift
        group: Shared
      - path: ../mac/Teyla/Core/GrowthLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleLogic.swift
        group: Shared
      # The activity graph's grid, words and kinds (docs/APP.md): the Growth tab draws the 17 weeks the Mac sends.
      - path: ../mac/Teyla/Core/Activity.swift
        group: Shared
      # The Today card's counts and words (docs/GTM.md): the Growth tab shows what the Mac sends in `gtm`, read-only.
      - path: ../mac/Teyla/Core/Gtm.swift
        group: Shared
      - path: ../mac/Teyla/Core/TodayLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGlimpse.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGoalCommands.swift
        group: Shared
    # The Share extension (docs/TASTE.md, "From the phone"). It is embedded in the app.
    dependencies:
      - target: TeylaShare
      # The home-screen and Lock Screen activity widget (docs/APP.md, "The activity widget").
      - target: TeylaWidget
    # The App Group is the queue the extension writes and the app empties. The relay key stays in the app's Keychain.
    entitlements:
      path: Teyla/Teyla.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zaitsew.teyla
    info:
      path: Teyla/Info.plist
      properties:
        CFBundleName: Teyla
        CFBundleDisplayName: Teyla
        CFBundleShortVersionString: "0.52.0"
        # Raise CURRENT_PROJECT_VERSION below by hand for each upload: the release tool does not.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The Mac's pairing code is a QR code holding `teyla-pair:v1:<key>`; the system Camera opens it here.
        CFBundleURLTypes:
          - CFBundleURLName: com.zaitsew.teyla.pair
            CFBundleURLSchemes:
              - teyla-pair
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Store readiness (POLICY 15): the app only uses encryption the system provides.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Teyla uses the camera to scan the pairing code shown on your Mac. Nothing is recorded.
        NSMicrophoneUsageDescription: Teyla listens while you dictate, to turn your voice into text on this iPhone. Audio never leaves it.
        NSSpeechRecognitionUsageDescription: Teyla turns your speech into text on this iPhone only. Nothing is sent to a server.
    settings:
      base:
        PRODUCT_NAME: Teyla
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla
        # iPhone only. XcodeGen's iOS default is "1,2", so it is set here, on the target (POLICY 15).
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Teyla/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TeylaShare:
    type: app-extension
    platform: iOS
    sources:
      - TeylaShare
      # Compiled into the app too; it depends on nothing else, so the extension never holds the relay key.
      - path: Shared/TasteQueue.swift
        group: Shared
    entitlements:
      path: TeylaShare/TeylaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zaitsew.teyla
    info:
      path: TeylaShare/Info.plist
      properties:
        CFBundleName: Teyla
        CFBundleDisplayName: Teyla
        CFBundleShortVersionString: "0.52.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_NAME: TeylaShare
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.share
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TeylaShare/Info.plist
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  TeylaWidget:
    type: app-extension
    platform: iOS
    sources:
      - TeylaWidget
      # Compiled into the app too; it depends on nothing else, so the widget never holds the relay key.
      - path: Shared/ActivityWidgetData.swift
        group: Shared
    entitlements:
      path: TeylaWidget/TeylaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zaitsew.teyla
    info:
      path: TeylaWidget/Info.plist
      properties:
        CFBundleName: Teyla
        CFBundleDisplayName: Teyla
        CFBundleShortVersionString: "0.52.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TeylaWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.widget
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TeylaWidget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TeylaTests:
    type: bundle.unit-test
    platform: iOS
    # Logic-only tests: the Core sources and AppModel are compiled into the bundle, so no app is launched.
    sources:
      - TeylaTests
      - Teyla/Core
      - Teyla/App/AppModel.swift
      - path: Shared/TasteQueue.swift
        group: Shared
      - path: Shared/ActivityWidgetData.swift
        group: Shared
      - path: ../mac/Teyla/Core/Models.swift
        group: Shared
      - path: ../mac/Teyla/Core/Format.swift
        group: Shared
      # What Home and Decisions decide (who a question belongs to, what a core card says) is the Mac's code too.
      - path: ../mac/Teyla/Core/HomeLogic.swift
        group: Shared
      # The admin sections' parsers and words.
      - path: ../mac/Teyla/Core/ConsoleReport.swift
        group: Shared
      - path: ../mac/Teyla/Core/TeylaError.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleCompact.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleGrowth.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleOperations.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleMoney.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsolePlaybook.swift
        group: Shared
      - path: ../mac/Teyla/Core/GrowthLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/ConsoleLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/Activity.swift
        group: Shared
      - path: ../mac/Teyla/Core/Gtm.swift
        group: Shared
      - path: ../mac/Teyla/Core/TodayLogic.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGlimpse.swift
        group: Shared
      - path: ../mac/Teyla/Core/GtmGoalCommands.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Teyla:
    build:
      targets:
        Teyla: all
    test:
      targets:
        - TeylaTests
