name: Teyla
options:
  bundleIdPrefix: com.zaitsew
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Teyla:
    type: application
    platform: macOS
    sources:
      - path: Teyla
        excludes:
          - "Store/**"
          - "*.entitlements"
    info:
      path: Teyla/Info.plist
      properties:
        # "Teyla Admin", so Finder, Spotlight and the Dock tell it apart from the store build named Teyla.
        CFBundleName: Teyla Admin
        CFBundleDisplayName: Teyla Admin
        CFBundleShortVersionString: "0.53.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: false
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "MIT License"
        # Voice input: recognised on this Mac only. Both strings are shown in the permission dialogs.
        NSSpeechRecognitionUsageDescription: "Teyla turns your voice into text on this Mac, so you can dictate answers, corrections and new tasks. No audio leaves your Mac."
        NSMicrophoneUsageDescription: "Teyla listens while you hold the microphone button or the shortcut, and turns your voice into text on this Mac."
    settings:
      base:
        PRODUCT_NAME: Teyla
        # The full app, installed by install.sh. Its own id, so it can live beside the store build
        # (com.zaitsew.teyla). A first launch copies the old settings over (Core/DefaultsMigration.swift).
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.local
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Teyla/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local, ad-hoc signing only. Nothing here is registered with Apple.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  # The Mac App Store and TestFlight build: App Sandboxed, a client of the signed relay folder (docs/APP.md,
  # "The store build"). Same product name and bundle id as the iPhone app (universal purchase). Signing is
  # automatic here, with no identity override; the release script passes the team and signs by hand.
  TeylaStore:
    type: application
    platform: macOS
    sources:
      - path: Teyla
        excludes:
          - "Info.plist"
          - "*.entitlements"
          # The sandboxed build runs no commands: the CLI client, the binary finder, the session watcher
          # and the "teyla not found" screen are left out of the binary altogether.
          - "Core/TeylaCLI.swift"
          - "Core/TeylaBinary.swift"
          - "Core/SessionWatcher.swift"
          - "UI/NotFoundView.swift"
      # The relay client of the iPhone app: signing, the folder reader and the key/pending storage. Read-only.
      - path: ../ios/Teyla/Core/RelayStore.swift
      - path: ../ios/Teyla/Core/RelayCrypto.swift
      - path: ../ios/Teyla/Core/Storage.swift
    info:
      path: TeylaStore/Info.plist
      properties:
        CFBundleName: Teyla
        CFBundleDisplayName: Teyla
        CFBundleShortVersionString: "0.53.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: false
        LSMinimumSystemVersion: "15.0"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "MIT License"
        # `teyla relay connect` (and the iPhone's camera) hands the pairing key to this build as teyla-pair:v1:<key>.
        # Only this target registers the scheme; the full Teyla target must not, or it would take the link from this one.
        CFBundleURLTypes:
          - CFBundleURLName: com.zaitsew.teyla.pairing
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - teyla-pair
        NSSpeechRecognitionUsageDescription: "Teyla turns your voice into text on this Mac, so you can dictate answers, corrections and new tasks. No audio leaves your Mac."
        NSMicrophoneUsageDescription: "Teyla listens while you hold the microphone button or the shortcut, and turns your voice into text on this Mac."
    settings:
      base:
        PRODUCT_NAME: Teyla
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla
        # The store archive takes the team from here (not a secret). The full app has none.
        DEVELOPMENT_TEAM: VWH2FKV78Q
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TeylaStore/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STORE"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Teyla/TeylaStore.entitlements
  TeylaTests:
    type: bundle.unit-test
    platform: macOS
    # Logic-only tests: the Core sources are compiled into the bundle, so no app is launched.
    sources:
      - TeylaTests
      - Teyla/Core
      # The Tools page's model and the command bar's hold no view: they run against a stub backend in the tests.
      - Teyla/App/ToolsModel.swift
      - Teyla/App/ConsoleModel.swift
      - Teyla/App/CommandBarModel.swift
      - Teyla/App/StartupModel.swift
      - Teyla/Store/StoreBackend.swift
      - Teyla/Store/StoreSession.swift
      - Teyla/Store/FolderPanelPlan.swift
      - Teyla/Store/MacKeyStore.swift
      - ../ios/Teyla/Core/RelayStore.swift
      - ../ios/Teyla/Core/RelayCrypto.swift
      - ../ios/Teyla/Core/Storage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.teyla.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Teyla:
    build:
      targets:
        Teyla: all
    test:
      targets:
        - TeylaTests
  TeylaStore:
    build:
      targets:
        TeylaStore: all
