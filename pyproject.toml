[project]
name = "teyla"
version = "0.35.0"
description = "Teyla reads your Claude Code and Codex sessions on your Mac, shows what they cost and what's waiting on you, and fixes the waste. Nothing about your sessions leaves your Mac unless you turn it on."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ivan Zaitsev" }]
keywords = ["claude-code", "codex", "agents", "ai-adoption", "observability", "routines"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# A managed laptop behind a TLS-inspecting proxy: truststore makes Python use the OS keychain,
# where MDM installs the proxy's root CA, so no SSL_CERT_FILE has to be exported anywhere.
work = ["truststore>=0.9"]
# teyla reel render draws frames with Pillow and pipes them to ffmpeg (ffmpeg comes from PATH).
reel = ["pillow>=10"]

[project.scripts]
teyla = "teyla.cli:main"

[project.urls]
Homepage = "https://github.com/zaitsew/teyla"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teyla"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "teyla/templates"
"plugin" = "teyla/plugin"
"prompts" = "teyla/prompts"
# teyla reel imports the leak guard's secret patterns and term loader instead of copying them.
"scripts/leak_check.py" = "teyla/_leak_check.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
