name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e . pytest
      - run: .venv/bin/pytest -q
      - name: version matches tag
        run: |
          v=$(.venv/bin/teyla --version)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package is $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
