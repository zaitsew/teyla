name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e . pytest
      - run: .venv/bin/pytest -q
      - name: clean-machine path — init, sync, then doctor must be clean
        run: |
          .venv/bin/teyla policy init --owner ci --claude-md
          .venv/bin/teyla policy sync
          .venv/bin/teyla policy refresh
          .venv/bin/teyla plugin install .
          .venv/bin/teyla plugin refresh
          .venv/bin/teyla doctor
