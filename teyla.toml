# teyla.toml — what `teyla testflight` needs to know about this repo's Apple builds.
# Only the release table is kept here; the repo declares no routines or checks.

[product]
name = "teyla"

[release]
apple_bundle_id = "com.zaitsew.teyla"   # the iPhone and Mac store builds share one record (universal purchase)

# The Mac App Store build. `teyla testflight` compares the date of its newest upload with the newest
# change on main to these sources, and warns with the release command when the build lags. The full app
# (`com.zaitsew.teyla.local`, scheme `Teyla`) is installed by apps/mac/install.sh and is not a store build.
# Since 2026-11-07 the owner keeps only Teyla Admin on his Mac and asked to drop the store build from TestFlight
# too. Upload a Mac store build only for a Mac App Store submission, never as a routine train step.
[[release.store_target]]
platform = "macos"
scheme = "TeylaStore"
project = "apps/mac/Teyla.xcodeproj"
frozen = "2026-11-07: the owner uses Teyla Admin, not the store build"
frozen_now = true     # a decision, not idle time: silent from that date, and each `teyla testflight` run says so
# The TeylaStore sources in apps/mac/project.yml: the app folder minus the command-running files,
# plus the relay client shared with the iPhone app.
paths = [
  "apps/mac/Teyla",
  "apps/mac/project.yml",
  "apps/ios/Teyla/Core/RelayStore.swift",
  "apps/ios/Teyla/Core/RelayCrypto.swift",
  "apps/ios/Teyla/Core/Storage.swift",
  ":(exclude)apps/mac/Teyla/Core/TeylaCLI.swift",
  ":(exclude)apps/mac/Teyla/Core/TeylaBinary.swift",
  ":(exclude)apps/mac/Teyla/Core/SessionWatcher.swift",
  ":(exclude)apps/mac/Teyla/UI/NotFoundView.swift",
]

# `teyla freshness`: each README screenshot is judged by the sources that draw that screen, not by every
# change in the repo. An image goes stale after 5 user-facing changes to its surface.
[freshness.surfaces]
"docs/img/mac/**" = ["apps/mac/Teyla/**"]
"docs/img/ios/**" = ["apps/ios/Teyla/**", "apps/ios/TeylaWidget/**", "apps/ios/Shared/**"]
"docs/img/web-*.png" = ["src/teyla/web/**", "src/teyla/start.py"]

# AI directory listings, shown as platforms by `teyla portfolio` (docs/APP.md). Copied from the portals by hand:
# update `state` and `as_of` whenever a portal changes. docs/DIRECTORY.md holds the submission history.
[directories.claude]
state = "needs_changes"
kind = "plugin"
version = "0.40.0"
as_of = 2026-11-07
link = "https://claude.ai/directory/manage"
note = "0.40.0 blocked by directory policy, waiting on the owner"

[directories.chatgpt]
state = "parked"
kind = "plugin"
as_of = 2026-10-29
note = "OpenAI accepts neither skills-only nor local MCP plugins (docs/DIRECTORY.md section 6)"

# Hosts that appear in the code but are never requested by Teyla (docs/HOSTS.md). The early-access link is written into
# a draft's first comment (growth_formats.py); only the reader's click ever reaches it.
[privacy]
hosts = ["accounts.fabriquefutur.com"]
