<svg xmlns="http://www.w3.org/2000/svg" width="880" height="189" viewBox="0 0 880 189" role="img" aria-label="How it works. 1. Paste one line. Your agent installs Teyla. 2. See the diagnosis. 30 days of cost and waste. 3. Tick your packs. Only ticked packs turn on. 4. Answer what waits. Questions, notes, next step. 5. Undo any change. Every change has a way back.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="188" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Paste one line</text>
<text class="m" x="40.0" y="120" font-size="13.5">Your agent installs</text>
<text class="m" x="40.0" y="139" font-size="13.5">Teyla.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">See the diagnosis</text>
<text class="m" x="200.0" y="120" font-size="13.5">30 days of cost and</text>
<text class="m" x="200.0" y="139" font-size="13.5">waste.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Tick your packs</text>
<text class="m" x="360.0" y="120" font-size="13.5">Only ticked packs</text>
<text class="m" x="360.0" y="139" font-size="13.5">turn on.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Answer what</text>
<text class="b" x="520.0" y="118" font-size="15.5">waits</text>
<text class="m" x="520.0" y="140" font-size="13.5">Questions, notes,</text>
<text class="m" x="520.0" y="159" font-size="13.5">next step.</text>
<circle cx="700.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Undo any change</text>
<text class="m" x="680.0" y="120" font-size="13.5">Every change has a</text>
<text class="m" x="680.0" y="139" font-size="13.5">way back.</text>
</svg>
